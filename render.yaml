services:
  - type: web
    name: waste-sorting-qc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CONF_THRESHOLD
        value: "0.8"
      - key: AUDIT_RATE
        value: "0.05"
      - key: APP_PASSWORD     # set in the Render dashboard; protects the whole site
        sync: false
